    <title>Dolancer. Get paid for what you are already good at.</title>
    <style>
      /* Pre-paint canvas: never flash blank white while the bundle loads.
         This boot stage mirrors the React loader exactly (144px logo, dots,
         corner blobs, bob rhythm) so the handoff is invisible. */
      html { background: #2563eb; }
      html[data-palette="violet"] { background: #7c3aed; }
      html[data-palette="mint"] { background: #0f766e; }
      html[data-palette="sunset"] { background: #ea580c; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9998;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; overflow: hidden;
        background: #2563eb;
      }
      #boot-splash[data-boot-palette="violet"] { background: #7c3aed; }
      #boot-splash[data-boot-palette="mint"] { background: #0f766e; }
      #boot-splash[data-boot-palette="sunset"] { background: #ea580c; }
      #boot-splash .boot-logo {
        width: 144px; height: 144px; border-radius: 28px; overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        animation: boot-float 1.8s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      #boot-splash .boot-dots { display: flex; gap: 8px; }
      #boot-splash .boot-dots span {
        width: 10px; height: 10px; border-radius: 50%; background: #fff;
        animation: boot-dot 1s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) { animation-delay: 0.18s; }
      #boot-splash .boot-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.3; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-5px); }
      }
      #boot-splash .boot-blob { position: absolute; }
      #boot-splash .boot-blob-1 {
        top: -9rem; right: -7rem; width: 30rem; height: 30rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 42% 58% 63% 37% / 45% 42% 58% 55%;
      }
      #boot-splash .boot-blob-2 {
        bottom: -11rem; left: -7rem; width: 34rem; height: 34rem;
        background: rgba(0, 0, 0, 0.1);
        border-radius: 58% 42% 37% 63% / 52% 58% 42% 48%;
      }
    </style>
    <script>
      // Sync the saved palette before first paint so the boot splash and the
      // React loader open in the right theme colour (no blue flash).
      try {
        var raw = localStorage.getItem("dolancer.ui");
        var palette = raw ? JSON.parse(raw).state?.palette : undefined;
        if (palette === "cobalt" || palette === "violet" || palette === "mint" || palette === "sunset") {
          document.documentElement.dataset.palette = palette;
          window.__BOOT_PALETTE = palette;
        }
      } catch (e) { /* default palette */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="Loading Dolancer">
      <div class="boot-blob boot-blob-1"></div>
      <div class="boot-blob boot-blob-2"></div>
      <svg class="boot-logo" width="144" height="144" viewBox="0 0 340 340" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      </svg>
      <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <noscript><style>#boot-splash { display: none; }</style></noscript>
    <script>
      try {
        if (window.__BOOT_PALETTE) {
          document.getElementById("boot-splash")?.setAttribute("data-boot-palette", window.__BOOT_PALETTE);
        }
      } catch (e) { /* default colour */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
